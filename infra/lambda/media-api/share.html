<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>{{title}} · Panther</title>{{social}}<link rel="stylesheet" href="/share.css"></head>
<body><main><div class="brand">PANTHER <span>Shared with you</span></div>
<h1>{{title}}</h1><section class="player">{{player}}</section>

<p class="help">No account needed. On iPhone, tap Download file, then choose Download if prompted. Find it in Files → Downloads.</p>
<p class="privacy">Anyone with this link can access this file. The owner can turn sharing off.</p>
</main></body></html>
