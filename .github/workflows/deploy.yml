name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: panther-main-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'fourmajor/panther'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_smoke.py

  deploy:
    if: github.repository == 'fourmajor/panther'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: infra
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::223663280572:role/PantherGitHubDeploy
          aws-region: us-west-2
          role-duration-seconds: 7200
      - name: Write identities outside the checkout
        env:
          PANTHER_IDENTITIES: ${{ secrets.PANTHER_IDENTITIES }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          raw = os.environ.get("PANTHER_IDENTITIES", "")
          if not raw.strip():
              sys.exit("Set the PANTHER_IDENTITIES secret to the private identities JSON.")
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "panther-identities.json"
          path.write_text(raw)
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PANTHER_IDENTITIES_FILE={path}\n")
          PY
      - name: Deploy
        env:
          PANTHER_DEPLOY_BASE: ${{ github.event.before }}
          PANTHER_AWS_ACCOUNT_ID: "223663280572"
        run: bash ops/deploy.sh
