name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Never run untrusted PR/fork code on a personal machine.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'fourmajor'
    runs-on: [self-hosted, Linux, panther-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: infra
      - run: npm test
        working-directory: infra
      - run: npx playwright install chromium
        working-directory: infra
      - run: npm run test:browser
        working-directory: infra
      - run: >-
          npm run synth --
          --context account=000000000000
        working-directory: infra
