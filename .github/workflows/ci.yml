name: CI

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification scope (nightly always runs full)
        type: choice
        options: [full, full-and-deployed, deployed]
        default: full
  schedule:
    # Avoid GitHub's documented top-of-hour scheduling congestion. This remains
    # best-effort: the daily audit must verify that a scheduled run really exists.
    - cron: "37 12 * * *"

concurrency:
  group: panther-self-hosted-quality
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # Never run untrusted PR/fork code on a personal machine.
    if: >-
      github.repository == 'fourmajor/panther' &&
      inputs.suite != 'deployed' &&
      ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))))
    runs-on: [self-hosted, Linux, panther-local]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: web/ui
      - name: React UI build and data-layer checks
        run: |
          npm run build
          npm test
          git diff --exit-code -- ../media-explorer/ui-runtime.js ../media-explorer/ui-system.css
        working-directory: web/ui
      - run: npm ci --no-audit --no-fund
        working-directory: infra
      - run: npm test
        working-directory: infra
      - run: npx playwright install chromium
        working-directory: infra
      - name: Critical end-user smoke (readers and session discovery)
        run: >-
          npx playwright test browser-tests/end-user-audit.spec.cjs
          browser-tests/session-library.spec.cjs
          --grep "Plain text transcript|Sessions opens readable"
          --workers=1 --reporter=line --output=smoke-test-results
        working-directory: infra
      - name: Playwright browser tests (self-hosted)
        run: npm run test:browser -- --reporter=line
        working-directory: infra
      - name: Browser test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            infra/test-results/
            infra/smoke-test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: >-
          npm run synth --
          --context account=000000000000
        working-directory: infra

  deployed-journeys:
    needs: test
    if: >-
      !cancelled() && (needs.test.result != 'skipped' || inputs.suite == 'deployed') &&
      github.repository == 'fourmajor/panther' &&
      ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' ||
         ((inputs.suite == 'deployed' || inputs.suite == 'full-and-deployed') && startsWith(github.ref, 'refs/heads/codex/')))))
    runs-on: [self-hosted, Linux, panther-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        working-directory: infra
      - run: npx playwright install chromium
        working-directory: infra
      - name: Deployed website journeys (synthetic data, no production account)
        run: npm run test:deployed
        working-directory: infra
      - name: Deployed website evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-journey-results
          path: infra/deployed-test-results/
          if-no-files-found: error
          retention-days: 7
