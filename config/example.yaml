models:
  asr_provider: "mock"
  llm_provider: "mock"
  classifier_prompt: "prompts/v1/line_classifier.md"
  lore_prompt: "prompts/v1/lore_extractor.md"
  novel_prompt: "prompts/v1/novel_recap.md"
